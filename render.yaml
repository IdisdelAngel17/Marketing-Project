services:
  - type: web
    name: marketing-project
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: VITE_SUPABASE_URL
        value: "https://bmsmxierdyyupszrtuvm.supabase.co"
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_RESEND_API_KEY
        sync: false
      - key: VITE_RESEND_FROM
        value: "Community Manager IA <beth.t@example.com>"
